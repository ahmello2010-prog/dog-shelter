<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول المشرفين وغرفة العمليات | مأوى القاهرة للكلاب</title>
  <meta name="description" content="بوابة الدخول الإدارية للمشرفين والمسعفين والأطباء البيطريين لإدارة بلاغات الإنقاذ ومتابعة حالات مأوى القاهرة للكلاب الضالة." />

  <!-- Google Fonts: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            lotus: {
              50: '#FDF2F4',
              100: '#FCE7EC',
              200: '#F8D0DB',
              300: '#F2AEC1',
              400: '#E88CA6',
              500: '#D9829B',
              600: '#C76B85',
              700: '#B85875',
              800: '#9E425E',
              900: '#83394E',
            },
            charcoal: {
              700: '#334155',
              800: '#1E293B',
              900: '#111827',
              950: '#0F172A',
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            tajawal: ['Tajawal', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-charcoal-950 text-white font-cairo antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- خلفية بصرية متدرجة مع تمويه اللوتس -->
  <div class="absolute inset-0 opacity-20 pointer-events-none">
    <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-lotus-600 blur-3xl"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-lotus-900 blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- الشعار -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3 group">
        <div class="w-12 h-12 rounded-2xl bg-lotus-600 text-white flex items-center justify-center shadow-lg shadow-lotus-900/40 group-hover:scale-105 transition-transform duration-200">
          <i class="fa-solid fa-paw text-2xl"></i>
        </div>
        <div class="text-right">
          <span class="block text-xl font-extrabold tracking-tight text-white">مأوى القاهرة للكلاب</span>
          <span class="block text-xs font-medium text-slate-400">بوابة إدارة العمليات والبلاغات الميدانية</span>
        </div>
      </a>
    </div>

    <!-- بطاقة تسجيل الدخول -->
    <div class="bg-charcoal-900/90 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-white/10 shadow-2xl">
      <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
        <div>
          <h1 class="text-lg font-bold text-white">تسجيل الدخول للنظام</h1>
          <p class="text-xs text-slate-400 mt-0.5">مخصص لمشرفي غرفة الطوارئ والأطباء البيطريين</p>
        </div>
        <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-lotus-400">
          <i class="fa-solid fa-lock text-sm"></i>
        </div>
      </div>

      <!-- زر تجريبي سريع بضغطة واحدة -->
      <div class="mb-6">
        <button 
          type="button" 
          id="quick-demo-login-btn" 
          class="w-full py-2.5 px-4 bg-lotus-600/20 hover:bg-lotus-600/30 border border-lotus-500/40 rounded-xl text-xs font-bold text-lotus-200 hover:text-white transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-bolt text-lotus-400"></i>
          <span>دخول تجريبي سريع بضغطة واحدة (مشرف العمليات)</span>
        </button>
      </div>

      <div class="relative flex items-center justify-center mb-6">
        <div class="border-t border-white/10 w-full"></div>
        <span class="bg-charcoal-900 px-3 text-[11px] text-slate-400 uppercase tracking-wider absolute">أو أدخل بياناتك</span>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="adminEmail" class="block text-xs font-bold text-slate-300 mb-1.5">البريد الإلكتروني المعتمد</label>
          <div class="relative">
            <input 
              type="email" 
              id="adminEmail" 
              value="dispatcher@cairoshelter.eg" 
              required 
              class="w-full px-4 py-2.5 pl-10 bg-white/5 border border-white/10 rounded-xl text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-lotus-500 focus:bg-white/10 transition-colors dir-ltr text-right"
            />
            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-xs text-slate-500"></i>
          </div>
        </div>

        <div>
          <label for="adminPassword" class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور</label>
          <div class="relative">
            <input 
              type="password" 
              id="adminPassword" 
              value="cairo2025" 
              required 
              class="w-full px-4 py-2.5 pl-10 bg-white/5 border border-white/10 rounded-xl text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-lotus-500 focus:bg-white/10 transition-colors dir-ltr text-right"
            />
            <i class="fa-solid fa-key absolute left-3.5 top-3 text-xs text-slate-500"></i>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="rounded border-white/20 bg-white/10 text-lotus-600 focus:ring-0" />
            <span>تذكر بياناتي في هذه الجلسة</span>
          </label>
          <a href="#" class="text-lotus-400 hover:text-lotus-300">نسيت كلمة المرور؟</a>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 px-4 bg-lotus-600 hover:bg-lotus-700 active:scale-[0.99] text-white font-bold text-xs sm:text-sm rounded-xl shadow-lg shadow-lotus-900/30 transition-all flex items-center justify-center gap-2 mt-2"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>دخول إلى لوحة التحكم الإدارية</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-white/10 text-center">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
          <span>الرجوع إلى البوابة العامة للمواطنين</span>
        </a>
      </div>
    </div>

    <!-- التذييل الصغير -->
    <p class="text-center text-[11px] text-slate-500 mt-6">
      نظام إدارة مأوى الكلاب بالقاهرة • مشفر ومحمي ببروتوكولات الأمان الداخلي
    </p>
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('admin-login-form');
      const quickBtn = document.getElementById('quick-demo-login-btn');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');

      const performLogin = (email, pass) => {
        window.ShelterDB.loginAdmin(email, pass);
        window.location.href = 'admin-dashboard.html';
      };

      if (quickBtn) {
        quickBtn.addEventListener('click', () => {
          performLogin('dispatcher@cairoshelter.eg', 'cairo2025');
        });
      }

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          performLogin(emailInput.value, passwordInput.value);
        });
      }
    });
  </script>
</body>
</html>
